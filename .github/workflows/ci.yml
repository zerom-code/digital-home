name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  app:
    name: Типы, тесты, сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci, а не npm install: ставит ровно те версии, что в лок-файле,
      # и не переписывает его молча под свежие патчи
      - run: npm ci

      - name: Типы
        run: npm run typecheck

      - name: Тесты
        run: npm run test

      - name: Сборка
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: build-time-placeholder
          VITE_APP_URL: https://example.com

  database:
    name: Миграции и RLS
    runs-on: ubuntu-latest

    # Тесты изоляции семей гоняются на настоящем Postgres: стек Supabase для
    # этого не нужен, схемы auth и storage подменяет шим
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Клиент Postgres
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Прогон миграций и тестов RLS
        run: bash scripts/db-test.sh
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
